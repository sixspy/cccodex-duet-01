<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>幂等账册 · 对拍</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="壳">
    <header class="顶栏">
      <div class="顶左">
        <div class="牌名">对拍</div>
        <div class="牌骨">左轨装载 → 右轨装载 → 同键对齐落差 → 单边悬账 → 对拍结论</div>
      </div>
      <nav class="管线">
          <a href="/">对拍台</a>
          <a href="/左轨.html">左轨流水</a>
          <a href="/右轨.html">右轨流水</a>
          <a href="/对齐差.html">对齐差表</a>
          <a href="/悬账单.html">悬账单</a>
          <a href="/对拍结论.html">对拍结论</a>
          <a href="/幂等.html" class="亮">幂等账册</a>
          <a href="/源登记.html">源登记</a>
          <a href="/轨规.html">轨规</a>
      </nav>
    </header>
    <main class="主">

      <section class="行卡">
        <h1>双边幂等键 · 切流账册形态</h1>
        <p class="说明">
          工程形态全局只留「切流账册」一边：账册钉已入事件编号，二次同号整票拒收，现行流水不增行，拒因可回读。
          不做「双写两轨 + 只读归档」形态——故归档恒 0 行；现行条数与归档条数在水位分开。
        </p>
        <div id="水位"></div>
        <div class="工具条"><button class="次" id="刷">刷新</button></div>
      </section>

      <section class="行卡">
        <h2>幂等只读接口</h2>
        <div class="工具条">
          <input id="幂查号" placeholder="输入事件编号" style="width:220px"/>
          <select id="幂查轨">
            <option value="">不限轨别</option>
            <option value="左">左</option>
            <option value="右">右</option>
          </select>
          <button id="幂查">查</button>
        </div>
        <div id="幂查果"></div>
      </section>

      <section class="行卡">
        <h2>账册钉号（已入事件编号）</h2>
        <div id="账册表"></div>
      </section>

      <section class="行卡">
        <h2>拒收史（拒因可回读）</h2>
        <div id="拒收表"></div>
      </section>

    </main>
  </div>
  <script src="/common.js"></script>
  <script>
(async () => {
  const paint水位 = async () => { document.getElementById("水位").innerHTML = await 幂等水位条(); };
  const paint = async () => {
    const 账 = await get("/api/幂等/账册");
    document.getElementById("账册表").innerHTML = 表(
      ["事件编号","业务键","轨别","源键","状态","拒收次数","末次拒因","批次","入流时刻"],
      账.行,
      r => `<td>${r.事件编号}</td><td>${r.业务键}</td><td>${徽(r.轨别)}</td><td>${r.源键}</td>
        <td>${徽(r.状态)}</td><td>${r.拒收次数}</td>
        <td>${r.末次拒因 ? 徽(r.末次拒因) : "-"}</td><td>${r.批次编号}</td><td>${r.入流时刻}</td>`
    );
    const 史 = await get("/api/幂等/拒收史");
    document.getElementById("拒收表").innerHTML = 表(
      ["事件编号","业务键","轨别","拒因","批次","时刻"],
      史.行,
      r => `<td>${r.事件编号}</td><td>${r.业务键}</td><td>${徽(r.轨别)}</td>
        <td>${徽(r.拒因)}</td><td>${r.批次编号}</td><td>${r.时刻}</td>`
    );
  };
  await paint水位(); await paint();
  document.getElementById("刷").onclick = async () => { await paint水位(); await paint(); };
  document.getElementById("幂查").onclick = () => {
    const 轨 = document.getElementById("幂查轨").value;
    return 幂等查询盒(轨 || null);
  };
  document.getElementById("幂查号").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const 轨 = document.getElementById("幂查轨").value;
      幂等查询盒(轨 || null);
    }
  });
})();
</script>
</body>
</html>

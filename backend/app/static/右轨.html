<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>右轨流水 · 对拍</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="壳">
    <header class="顶栏">
      <div class="顶左">
        <div class="牌名">对拍</div>
        <div class="牌骨">左轨装载 → 右轨装载 → 同键对齐落差 → 单边悬账 → 对拍结论</div>
      </div>
      <nav class="管线">
          <a href="/">对拍台</a>
          <a href="/左轨.html">左轨流水</a>
          <a href="/右轨.html" class="亮">右轨流水</a>
          <a href="/对齐差.html">对齐差表</a>
          <a href="/悬账单.html">悬账单</a>
          <a href="/对拍结论.html">对拍结论</a>
          <a href="/幂等.html">幂等账册</a>
          <a href="/源登记.html">源登记</a>
          <a href="/轨规.html">轨规</a>
      </nav>
    </header>
    <main class="主">

      <section class="行卡">
        <h1>右轨流水 · 核心记账</h1>
        <p class="说明">只装右轨，不在本页做对齐。双边幂等键跨左右轨：左轨已钉事件编号再灌右轨整票拒收（异轨同号）。</p>
        <div id="水位"></div>
        <div class="工具条">
          <select id="夹具"></select>
          <button id="灌">灌入右轨夹具</button>
          <button class="次" id="刷">刷新</button>
        </div>
        <div id="报"></div>
      </section>

      <section class="行卡">
        <h2>幂等只读查询</h2>
        <div class="工具条">
          <input id="幂查号" placeholder="输入事件编号" style="width:220px"/>
          <button id="幂查">查幂等状态</button>
        </div>
        <div id="幂查果"></div>
      </section>

      <section class="行卡"><h2>现行流水（二次同号不增行）</h2><div id="表"></div></section>
      <section class="行卡"><h2>本轨幂等拒收史</h2><div id="拒表"></div></section>

    </main>
  </div>
  <script src="/common.js"></script>
  <script>
(async () => {
  const fixtures = (await get("/api/夹具")).filter(x => x.includes("右"));
  const sel = document.getElementById("夹具");
  sel.innerHTML = fixtures.map(f => `<option value="${f}">${f}</option>`).join("") || '<option value="右轨样例">右轨样例</option>';

  const paint水位 = async () => { document.getElementById("水位").innerHTML = await 幂等水位条(); };
  const paint = async () => {
    const rows = await get("/api/右轨");
    document.getElementById("表").innerHTML = 表(
      ["事件编号","业务键","金额分","源键","命运","事件时","批次"],
      rows,
      r => `<td>${r.事件编号}</td><td>${r.业务键}</td><td>${r.金额分}</td><td>${r.源键}</td><td>${徽(r.命运)}</td><td>${r.事件时}</td><td>${r.批次编号}</td>`
    );
    const 史 = (await get("/api/幂等/拒收史")).行.filter(x => x.轨别 === "右");
    document.getElementById("拒表").innerHTML = 表(
      ["事件编号","业务键","轨别","拒因","批次","时刻"],
      史,
      r => `<td>${r.事件编号}</td><td>${r.业务键}</td><td>${徽(r.轨别)}</td><td>${徽(r.拒因)}</td><td>${r.批次编号}</td><td>${r.时刻}</td>`
    );
  };
  await paint水位(); await paint();
  document.getElementById("灌").onclick = async () => {
    const r = await post("/api/右轨/夹具装", { 夹具名: sel.value });
    document.getElementById("报").innerHTML = 装载摘要(r);
    await paint水位(); await paint();
  };
  document.getElementById("刷").onclick = async () => { await paint水位(); await paint(); };
  document.getElementById("幂查").onclick = () => 幂等查询盒("右");
  document.getElementById("幂查号").addEventListener("keydown", e => { if (e.key === "Enter") 幂等查询盒("右"); });
})();
</script>
</body>
</html>
